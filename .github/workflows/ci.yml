name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile all Python sources
        run: python -m compileall -q server poc
      - name: Shell syntax
        run: bash -n setup-local.sh server/install-service.sh server/watchdog.sh
      - name: Unit tests
        run: python -m unittest discover -s server -p "test_*.py" -v


  windows-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Windows Auto toggle
        run: dotnet build desktop/JevAutoToggle/JevAutoToggle.csproj -c Release
      - name: Byte-compile Python on Windows
        run: python -m compileall -q server poc
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            "setup-local.ps1",
            "server/install-service.ps1",
            "server/install-toggle.ps1",
            "server/uninstall-service.ps1",
            "server/run-service.ps1",
            "server/run-shadow-report.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file: $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
          }
